<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="痠痛紀錄">
  <title>痠痛紀錄</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf8f6; color: #38322f; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    .status { min-height: 100dvh; display: flex; justify-content: center; align-items: center; padding: 28px; }
    .panel { width: min(100%, 440px); padding: 28px 22px; text-align: center; background: white; border-radius: 20px; box-shadow: 0 6px 40px #46382d12; }
    .icon { font-size: 35px; }
    h1 { font-size: 21px; margin: 14px 0 10px; }
    p { line-height: 1.7; color: #726963; font-size: 14px; }
    small { display: block; font-size: 12px; line-height: 1.65; color: #a09a96; overflow-wrap: anywhere; }
    button { border: 0; border-radius: 12px; background: #6a5c55; color: white; font: inherit; font-weight: 600; padding: 12px 18px; margin: 13px 0; cursor: pointer; }
    .spinner { width: 28px; height: 28px; margin: auto; border: 3px solid #ece7e3; border-top-color: #7c6760; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main id="status" class="status" role="status" aria-live="polite">
    <div class="panel">
      <div class="spinner" aria-hidden="true"></div>
      <h1>正在恢復痠痛紀錄…</h1>
      <p>正在讀取你原本保存在 GitHub 的網頁程式，不會清除手機內的紀錄。</p>
      <small id="detail">正在連線到 GitHub</small>
    </div>
  </main>
  <script>
    /* BODY_TRACKER_RESCUE_WRAPPER v1.0
       This is a recovery launcher, not a copy of the complete original app.
       It loads the previous full index.html from this repository's Git history,
       pins the public JS dependencies and restores the HTML on the same origin.
       localStorage is never cleared or written by this launcher.
    */
    (function () {
      'use strict';
      var OWNER = 'sweijue';
      var REPO = 'body-tracker';
      var BRANCH = 'main';
      var detail = document.getElementById('detail');
      function status(msg) { detail.textContent = msg; }
      function fail(err) {
        console.error('Body tracker rescue failed', err);
        document.getElementById('status').innerHTML =
          '<div class="panel">' +
          '<div class="icon" aria-hidden="true">⚠️</div>' +
          '<h1>尚未成功載入原本的痠痛紀錄</h1>' +
          '<p>原始網頁暫時無法讀取，沒有刪除或修改手機的紀錄。請保持原本的主畫面 App，不要清除網站資料。</p>' +
          '<button type="button" onclick="location.reload()">重新載入</button>' +
          '<small id="error-detail"></small></div>';
        document.getElementById('error-detail').textContent = String(err && err.message || err);
      }
      function timedFetch(url) {
        var controller = new AbortController();
        var timeout = setTimeout(function () { controller.abort(); }, 15000);
        return fetch(url, { cache: 'no-store', signal: controller.signal })
          .then(function (response) {
            if (!response.ok) throw new Error('讀取失敗：HTTP ' + response.status + ' / ' + url);
            return response;
          }).finally(function () { clearTimeout(timeout); });
      }
      function patch(html) {
        // Pin versions so a future CDN release cannot silently break the app.
        html = html.replace(/https:\/\/(?:www\.)?unpkg\.com\/react(?:@[^/\s"']+)?\/umd\/react(?:\.production)?\.min\.js/gi,
          'https://unpkg.com/react@18.3.1/umd/react.production.min.js');
        html = html.replace(/https:\/\/(?:www\.)?unpkg\.com\/react-dom(?:@[^/\s"']+)?\/umd\/react-dom(?:\.production)?\.min\.js/gi,
          'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js');
        html = html.replace(/https:\/\/(?:www\.)?unpkg\.com\/@babel\/standalone(?:@[^/\s"']+)?\/babel\.min\.js/gi,
          'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js');
        // When the app is not mounted, explain the failure instead of a white page.
        var safetyStyle = '<style id="body-tracker-safe-fallback">#root:empty:after{content:"網頁仍在載入；如果此訊息持續顯示，表示程式尚未成功啟動。";display:block;max-width:340px;margin:25vh auto;text-align:center;color:#665b55;padding:24px;line-height:1.7;font:15px -apple-system,BlinkMacSystemFont,sans-serif}</style>';
        if (/<\/head\s*>/i.test(html)) html = html.replace(/<\/head\s*>/i, safetyStyle + '</head>');
        return html;
      }
      var api = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/commits?path=index.html&per_page=25&sha=' + BRANCH;
      status('搜尋 GitHub 上的原始版本…');
      timedFetch(api).then(function (res) { return res.json(); })
        .then(async function (commits) {
          if (!Array.isArray(commits) || commits.length === 0) throw new Error('找不到 index.html 的歷史版本。');
          for (var i = 0; i < commits.length; i++) {
            var sha = commits[i].sha;
            if (!sha) continue;
            status('核對原始版本 ' + (i + 1) + ' / ' + commits.length + '…');
            try {
              var rawUrl = 'https://raw.githubusercontent.com/' + OWNER + '/' + REPO + '/' + sha + '/index.html';
              var html = await timedFetch(rawUrl).then(function (r) { return r.text(); });
              // Skip recovery wrappers and unrelated versions. Keep the original app as-is.
              if (html.includes('BODY_TRACKER_RESCUE_WRAPPER')) continue;
              if (!html.includes('pain-drawing-records') || !html.includes('<script')) continue;
              status('已找到原始網頁，正在啟動…');
              var repaired = patch(html);
              document.open();
              document.write(repaired);
              document.close();
              return;
            } catch (error) {
              console.warn('Could not recover commit ' + sha, error);
            }
          }
          throw new Error('歷史版本中未找到原本的痠痛紀錄網頁，或 GitHub 無法讀取原始碼。');
        }).catch(fail);
    })();
  </script>
</body>
</html>
