<script>
  // 用 localStorage 取代 Claude 環境的 window.storage，介面保持一致
  async function storageGet(key) {
    try {
      const v = localStorage.getItem(key);
      return v !== null ? { key, value: v } : null;
    } catch (e) {
      return null;
    }
  }
  async function storageSet(key, value) {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  }
</script>

const VIEW_LABELS = { side: "側面", front: "正面", back: "背面" };
const VIEW_ORDER = ["side", "front", "back"];

/* ---------------------------------------------------------------
   把側／正／背三張圖排在同一張「紙」上（水平並排，共用一個座標系）。
   放大縮小、平移都是對這整張紙操作，不是三張圖各自獨立同步而已。
---------------------------------------------------------------- */
const GAP = 24;
const TOP_MARGIN = 40;
const COMBINED = (() => {
  let x = 0;
  const layout = {};
  for (const v of VIEW_ORDER) {
    const { w, h } = BODY_IMAGES[v];
    layout[v] = { x, y: TOP_MARGIN, w, h };
    x += w + GAP;
  }
  return { layout, totalW: x - GAP, totalH: TOP_MARGIN + 628 };
})();

const MIN_SCALE = 1;
const MAX_SCALE = 60;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const dist2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid2 = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

function computeViewBox(zoom, w, h) {
  const vw = w / zoom.scale;
  const vh = h / zoom.scale;
  let x = zoom.cx * w - vw / 2;
  let y = zoom.cy * h - vh / 2;
  x = clamp(x, 0, Math.max(0, w - vw));
  y = clamp(y, 0, Math.max(0, h - vh));
  return { x, y, w: vw, h: vh };
}

const BRUSH_COLORS = [
  { key: "yellow", color: "#F5C518", label: "輕微" },
  { key: "orange", color: "#F08A3C", label: "痠痛" },
  { key: "red", color: "#E15550", label: "劇烈" },
];
const BRUSH_WIDTHS = [4, 9, 15, 21, 28];

function todayStr() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d.getTime() - tz).toISOString().slice(0, 10);
}

function strokePathD(points) {
  if (!points || points.length === 0) return "";
  if (points.length === 1) {
    return `M${points[0][0]},${points[0][1]} L${points[0][0]},${points[0][1]}`;
  }
  return `M${points.map((p) => p.join(",")).join(" L ")}`;
}

/* ---------------------------------------------------------------
   自訂日期欄位：不依賴手機原生日期輸入框的排版寬度（那是造成版面
   溢出的根源）。顯示的文字完全由自己控制、保證不會爆版；底下疊一個
   透明的原生 <input type="date">，負責點擊時跳出系統的日期選擇器。
---------------------------------------------------------------- */
function DateField({ label, hint, value, onChange }) {
  const parts = value.split("-");
  const displayText = `${parts[0]}/${parts[1]}/${parts[2]}`;
  return (
    <div>
      <label style={{ fontSize: 12, color: "#6B7570", display: "block", marginBottom: 6 }}>
        {label}
        {hint && <span style={{ color: "#9CA39C", fontWeight: 400 }}>{hint}</span>}
      </label>
      <div style={{ position: "relative", width: "100%", overflow: "hidden", borderRadius: 8 }}>
        <div
          style={{
            width: "100%",
            boxSizing: "border-box",
            padding: "10px 12px",
            borderRadius: 8,
            border: "1px solid #E0DCCF",
            fontSize: 14,
            background: "#FFFFFF",
            whiteSpace: "nowrap",
            overflow: "hidden",
            textOverflow: "ellipsis",
          }}
        >
          {displayText}
        </div>
        <input
          type="date"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          style={{
            position: "absolute",
            inset: 0,
            width: "100%",
            height: "100%",
            opacity: 0,
            border: "none",
            padding: 0,
            margin: 0,
            boxSizing: "border-box",
          }}
        />
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------
   合併畫布：側／正／背三張圖畫在同一個 SVG 座標系裡，
   縮放／平移是對整張紙一起做，不是三張圖各自獨立。
   單指畫圖；雙指縮放／平移；第二指按下會取消第一指誤畫的那一筆；
   重置縮放透過外部的「回到原始大小」按鈕。
---------------------------------------------------------------- */
function CombinedBodyCanvas({ strokes, interactive, onStroke, activeColor, activeWidth, zoom, onZoomChange, height }) {
  const svgRef = useRef(null);
  const drawRef = useRef(null); // {points, color, width}
  const pointersRef = useRef(new Map());
  const pinchRef = useRef(null);
  const [, forceRender] = useState(0);
  const effectiveZoom = zoom || { scale: 1, cx: 0.5, cy: 0.5 };
  const vb = computeViewBox(effectiveZoom, COMBINED.totalW, COMBINED.totalH);

  // 「最新值」ref：原生事件監聽只綁定一次，靠這個讀到每次 render 最新的
  // props／viewBox，不需要每次 prop 變動就整個重新綁定監聽器。
  const latestRef = useRef(null);
  latestRef.current = { strokes, interactive, onStroke, activeColor, activeWidth, zoom: effectiveZoom, onZoomChange, vb };

  useEffect(() => {
    const el = svgRef.current;
    if (!el) return;

    const clientToSvg = (clientX, clientY) => {
      const { vb } = latestRef.current;
      const rect = el.getBoundingClientRect();
      const x = vb.x + ((clientX - rect.left) / rect.width) * vb.w;
      const y = vb.y + ((clientY - rect.top) / rect.height) * vb.h;
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    };

    const onDown = (e) => {
      const { interactive, activeColor, activeWidth, zoom } = latestRef.current;
      if (!interactive) return;
      e.preventDefault();
      el.setPointerCapture(e.pointerId);
      pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointersRef.current.size >= 2) {
        // 第二指按下：放棄第一指誤畫的筆跡，切換為縮放／平移模式
        drawRef.current = null;
        const pts = [...pointersRef.current.values()];
        const m = mid2(pts[0], pts[1]);
        const rect = el.getBoundingClientRect();
        const { vb } = latestRef.current;
        const anchorX = vb.x + ((m.x - rect.left) / rect.width) * vb.w;
        const anchorY = vb.y + ((m.y - rect.top) / rect.height) * vb.h;
        pinchRef.current = {
          startDist: dist2(pts[0], pts[1]),
          startScale: zoom.scale,
          anchorFracX: anchorX / COMBINED.totalW,
          anchorFracY: anchorY / COMBINED.totalH,
        };
      } else {
        const [x, y] = clientToSvg(e.clientX, e.clientY);
        drawRef.current = { points: [[x, y]], color: activeColor, width: activeWidth };
      }
      forceRender((n) => n + 1);
    };

    const onMove = (e) => {
      const { interactive } = latestRef.current;
      if (!interactive || !pointersRef.current.has(e.pointerId)) return;
      e.preventDefault();
      pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pointersRef.current.size >= 2 && pinchRef.current) {
        const pts = [...pointersRef.current.values()];
        const d = dist2(pts[0], pts[1]) || 1;
        const m = mid2(pts[0], pts[1]);
        const { startDist, startScale, anchorFracX, anchorFracY } = pinchRef.current;
        const newScale = clamp(startScale * (d / startDist), MIN_SCALE, MAX_SCALE);
        const rect = el.getBoundingClientRect();
        const midXFrac = (m.x - rect.left) / rect.width;
        const midYFrac = (m.y - rect.top) / rect.height;
        const vw = COMBINED.totalW / newScale;
        const vh = COMBINED.totalH / newScale;
        const anchorPxX = anchorFracX * COMBINED.totalW;
        const anchorPxY = anchorFracY * COMBINED.totalH;
        let newX = anchorPxX - midXFrac * vw;
        let newY = anchorPxY - midYFrac * vh;
        newX = clamp(newX, 0, Math.max(0, COMBINED.totalW - vw));
        newY = clamp(newY, 0, Math.max(0, COMBINED.totalH - vh));
        const { onZoomChange } = latestRef.current;
        onZoomChange &&
          onZoomChange({
            scale: newScale,
            cx: (newX + vw / 2) / COMBINED.totalW,
            cy: (newY + vh / 2) / COMBINED.totalH,
          });
      } else if (pointersRef.current.size === 1 && drawRef.current) {
        const [x, y] = clientToSvg(e.clientX, e.clientY);
        drawRef.current.points.push([x, y]);
        forceRender((n) => n + 1);
      }
    };

    const onUp = (e) => {
      const { interactive, onStroke } = latestRef.current;
      if (!interactive) return;
      e.preventDefault();
      pointersRef.current.delete(e.pointerId);
      if (pointersRef.current.size < 2) pinchRef.current = null;
      if (pointersRef.current.size === 0 && drawRef.current) {
        onStroke(drawRef.current);
        drawRef.current = null;
      }
      forceRender((n) => n + 1);
    };

    el.addEventListener("pointerdown", onDown, { passive: false });
    el.addEventListener("pointermove", onMove, { passive: false });
    el.addEventListener("pointerup", onUp, { passive: false });
    el.addEventListener("pointercancel", onUp, { passive: false });
    // 保險：部分瀏覽器對觸控的滾動判定也看 touchmove，一併攔截
    const preventTouch = (e) => {
      if (latestRef.current.interactive) e.preventDefault();
    };
    el.addEventListener("touchstart", preventTouch, { passive: false });
    el.addEventListener("touchmove", preventTouch, { passive: false });

    return () => {
      el.removeEventListener("pointerdown", onDown);
      el.removeEventListener("pointermove", onMove);
      el.removeEventListener("pointerup", onUp);
      el.removeEventListener("pointercancel", onUp);
      el.removeEventListener("touchstart", preventTouch);
      el.removeEventListener("touchmove", preventTouch);
    };
  }, []); // 只綁定一次；隨時讀取 latestRef 取得最新資料，避免手勢進行到一半時監聽器被重綁

  return (
    <svg
      ref={svgRef}
      viewBox={`${vb.x} ${vb.y} ${vb.w} ${vb.h}`}
      style={{
        height,
        width: "auto",
        maxWidth: "100%",
        display: "block",
        margin: "0 auto",
        borderRadius: 6,
        cursor: interactive ? "crosshair" : "default",
        touchAction: interactive ? "none" : "auto",
      }}
    >
      {VIEW_ORDER.map((v) => {
        const L = COMBINED.layout[v];
        return <image key={v} href={BODY_IMAGES[v].src} x={L.x} y={L.y} width={L.w} height={L.h} />;
      })}
      {VIEW_ORDER.map((v) => {
        const L = COMBINED.layout[v];
        return (
          <text
            key={v}
            x={L.x + L.w / 2}
            y={TOP_MARGIN - 14}
            textAnchor="middle"
            fontSize="18"
            fill="#B9B2A0"
            fontFamily="'Noto Sans TC', sans-serif"
          >
            {VIEW_LABELS[v]}
          </text>
        );
      })}
      {strokes.map((s, i) => (
        <path
          key={i}
          d={strokePathD(s.points)}
          stroke={s.color}
          strokeWidth={s.width}
          fill="none"
          strokeLinecap="round"
          strokeLinejoin="round"
          opacity="0.55"
          style={{ mixBlendMode: "multiply" }}
        />
      ))}
      {drawRef.current && (
        <path
          d={strokePathD(drawRef.current.points)}
          stroke={drawRef.current.color}
          strokeWidth={drawRef.current.width}
          fill="none"
          strokeLinecap="round"
          strokeLinejoin="round"
          opacity="0.55"
          style={{ mixBlendMode: "multiply" }}
        />
      )}
    </svg>
  );
}

function legacyFlatten(strokes) {
  if (Array.isArray(strokes)) return strokes;
  if (strokes && typeof strokes === "object") {
    return [...(strokes.side || []), ...(strokes.front || []), ...(strokes.back || [])];
  }
  return [];
}

function BodyPainTracker() {
  const [history, setHistory] = useState([]); // 單一畫布，直接存筆跡陣列
  const [activeColorKey, setActiveColorKey] = useState("yellow");
  const [sizeIndex, setSizeIndex] = useState(0); // 預設最細
  const [zoom, setZoom] = useState({ scale: 1, cx: 0.5, cy: 0.5 });
  const [classDate, setClassDate] = useState(todayStr());
  const [date, setDate] = useState(todayStr());
  const [note, setNote] = useState("");
  const [records, setRecords] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [expandedGroups, setExpandedGroups] = useState(() => new Set());
  const [error, setError] = useState("");

  const activeColor = BRUSH_COLORS.find((c) => c.key === activeColorKey).color;
  const activeWidth = BRUSH_WIDTHS[sizeIndex];

  useEffect(() => {
    (async () => {
      try {
        const res = await storageGet("pain-drawing-records");
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setRecords(parsed);
          if (parsed.length > 0) {
            const mostRecentClassDate = [...parsed].sort((a, b) =>
              b.classDate.localeCompare(a.classDate)
            )[0].classDate;
            setExpandedGroups(new Set([mostRecentClassDate]));
            // 讀出上次存的上課日期
            setClassDate(mostRecentClassDate);
          }
        }
        // 同時讀取上次存的上課日期（以防萬一沒有記錄但有日期存檔）
        const dateres = await storageGet("pain-drawing-lastClassDate");
        if (dateres && dateres.value) {
          setClassDate(dateres.value);
        }
      } catch (e) {
        // 尚無資料屬正常情況
      }
      setLoaded(true);
    })();
  }, []);

  const persist = useCallback(async (next) => {
    try {
      await storageSet("pain-drawing-records", JSON.stringify(next));
    } catch (e) {
      setError("儲存失敗，請稍後再試");
    }
  }, []);

  const addStroke = (stroke) => setHistory((prev) => [...prev, stroke]);
  const undo = () => setHistory((prev) => prev.slice(0, -1));
  const clearAll = () => setHistory([]);
  const hasAnyStroke = history.length > 0;

  const saveEntry = () => {
    if (!hasAnyStroke) {
      setError("還沒有畫任何標記");
      return;
    }
    const rec = {
      id: `${Date.now()}`,
      classDate,
      date,
      note: note.trim(),
      strokes: history,
      createdAt: new Date().toISOString(),
    };
    const next = [rec, ...records];
    setRecords(next);
    persist(next);
    // 同時保存上次用的上課日期，以便下次重開 App 時讀取
    (async () => {
      try {
        await storageSet("pain-drawing-lastClassDate", classDate);
      } catch (e) {
        // ignore
      }
    })();
    setExpandedGroups((prev) => new Set([...prev, classDate]));
    setHistory([]);
    setNote("");
    setZoom({ scale: 1, cx: 0.5, cy: 0.5 });
    // 上課日期保持不變（同一堂課後續幾天都會用到）；記錄日期回到今天
    setDate(todayStr());
    setError("");
  };

  const deleteRecord = (id) => {
    const next = records.filter((r) => r.id !== id);
    setRecords(next);
    persist(next);
  };

  // 依「上課日期」分組，組內依「記錄日期」由舊到新排序（方便看痠痛演變）
  const groupedByClassDate = useMemo(() => {
    const groups = {};
    for (const r of records) {
      if (!groups[r.classDate]) groups[r.classDate] = [];
      groups[r.classDate].push(r);
    }
    Object.values(groups).forEach((arr) =>
      arr.sort((a, b) => a.date.localeCompare(b.date) || a.createdAt.localeCompare(b.createdAt))
    );
    return Object.entries(groups).sort((a, b) => b[0].localeCompare(a[0]));
  }, [records]);

  // 攤平成一份完整清單（跟畫面上顯示的順序一致），供放大檢視時左右瀏覽
  const flatEntries = useMemo(
    () => groupedByClassDate.flatMap(([, entries]) => entries),
    [groupedByClassDate]
  );
  const [viewerIndex, setViewerIndex] = useState(null); // null = 檢視器關閉
  const openViewer = (id) => {
    const idx = flatEntries.findIndex((r) => r.id === id);
    if (idx >= 0) setViewerIndex(idx);
  };
  const closeViewer = () => setViewerIndex(null);
  const viewerPrev = () => setViewerIndex((i) => (i > 0 ? i - 1 : i));
  const viewerNext = () => setViewerIndex((i) => (i < flatEntries.length - 1 ? i + 1 : i));

  const toggleGroup = (cd) => {
    setExpandedGroups((prev) => {
      const next = new Set(prev);
      if (next.has(cd)) next.delete(cd);
      else next.add(cd);
      return next;
    });
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#F3EFE6",
        fontFamily:
          "'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif",
        color: "#2E3532",
        padding: "24px 16px 60px",
        boxSizing: "border-box",
        overflowX: "hidden",
        width: "100%",
      }}
    >
      <div style={{ maxWidth: 460, margin: "0 auto", width: "100%", boxSizing: "border-box" }}>
        <header style={{ marginBottom: 16 }}>
          <div
            style={{
              fontSize: 12,
              letterSpacing: "0.12em",
              color: "#7A8C81",
              textTransform: "uppercase",
              marginBottom: 4,
            }}
          >
            Pilates Body Log
          </div>
          <h1 style={{ fontSize: 22, fontWeight: 700, margin: 0, color: "#2C4A43" }}>
            痠痛紀錄
          </h1>
          <p style={{ fontSize: 13, color: "#6B7570", margin: "4px 0 0" }}>
            直接在圖上塗出痠痛的位置
          </p>
        </header>

        {/* 日期：自訂顯示，避免手機原生日期選單把版面撐出螢幕 */}
        <div style={{ marginBottom: 12 }}>
          <div style={{ marginBottom: 10 }}>
            <DateField
              label="上課日期"
              hint="（會記住上次選的）"
              value={classDate}
              onChange={setClassDate}
            />
          </div>
          <DateField label="記錄日期" value={date} onChange={setDate} />
        </div>

        {/* 合併畫布：側／正／背在同一張紙上，縮放平移是整張紙一起動 */}
        <div
          style={{
            background: "#FFFFFF",
            borderRadius: 16,
            padding: 12,
            boxShadow: "0 1px 3px rgba(44,74,67,0.08)",
            marginBottom: 12,
            touchAction: "none",
            overscrollBehavior: "contain",
          }}
        >
          <CombinedBodyCanvas
            strokes={history}
            interactive
            onStroke={addStroke}
            activeColor={activeColor}
            activeWidth={activeWidth}
            zoom={zoom}
            onZoomChange={setZoom}
            height={330}
          />
          <div style={{ textAlign: "center", fontSize: 11, color: "#9CA39C", marginTop: 8 }}>
            雙指開合可放大／縮小整張圖
          </div>
          {zoom.scale > 1.02 && (
            <button
              onClick={() => setZoom({ scale: 1, cx: 0.5, cy: 0.5 })}
              style={{
                display: "block",
                margin: "10px auto 0",
                padding: "6px 16px",
                borderRadius: 20,
                border: "1px solid #2C4A43",
                background: "#F3EFE6",
                color: "#2C4A43",
                fontSize: 12,
                fontWeight: 600,
                cursor: "pointer",
              }}
            >
              ⤢ 回到原始大小（目前 {zoom.scale.toFixed(1)}x）
            </button>
          )}
        </div>

        {/* 畫筆工具列 */}
        <div
          style={{
            background: "#FFFFFF",
            borderRadius: 16,
            padding: 14,
            boxShadow: "0 1px 3px rgba(44,74,67,0.08)",
            marginBottom: 16,
          }}
        >
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            {BRUSH_COLORS.map((c) => (
              <button
                key={c.key}
                onClick={() => setActiveColorKey(c.key)}
                style={{
                  flex: 1,
                  padding: "8px 0",
                  borderRadius: 10,
                  border: activeColorKey === c.key ? "2px solid #2C4A43" : "1px solid #E0DCCF",
                  background: c.color,
                  opacity: activeColorKey === c.key ? 1 : 0.55,
                  cursor: "pointer",
                  fontSize: 12,
                  fontWeight: 700,
                  color: "#2E3532",
                }}
              >
                {c.label}
              </button>
            ))}
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
              <span style={{ fontSize: 12, color: "#6B7570", flexShrink: 0 }}>筆刷粗細</span>
              <input
                type="range"
                min={0}
                max={BRUSH_WIDTHS.length - 1}
                step={1}
                value={sizeIndex}
                onChange={(e) => setSizeIndex(Number(e.target.value))}
                style={{ flex: 1, accentColor: "#2C4A43" }}
              />
              <span
                style={{
                  width: 22,
                  height: 22,
                  borderRadius: "50%",
                  background: activeColor,
                  flexShrink: 0,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                }}
              >
                <span
                  style={{
                    width: BRUSH_WIDTHS[sizeIndex],
                    height: BRUSH_WIDTHS[sizeIndex],
                    maxWidth: 18,
                    maxHeight: 18,
                    borderRadius: "50%",
                    background: "#2E3532",
                    opacity: 0.55,
                  }}
                />
              </span>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button
              onClick={undo}
              disabled={!hasAnyStroke}
              style={{
                flex: 1,
                padding: "8px 0",
                borderRadius: 10,
                border: "1px solid #E0DCCF",
                background: "none",
                color: hasAnyStroke ? "#2C4A43" : "#C9C2AE",
                cursor: hasAnyStroke ? "pointer" : "default",
                fontSize: 13,
                fontWeight: 600,
              }}
            >
              ↩ 回上一步
            </button>
            <button
              onClick={clearAll}
              disabled={!hasAnyStroke}
              style={{
                flex: 1,
                padding: "8px 0",
                borderRadius: 10,
                border: "1px solid #E0DCCF",
                background: "none",
                color: hasAnyStroke ? "#B8412F" : "#C9C2AE",
                cursor: hasAnyStroke ? "pointer" : "default",
                fontSize: 13,
              }}
            >
              清除全部標記
            </button>
          </div>
        </div>

        {/* 備註與儲存 */}
        <div
          style={{
            background: "#FFFFFF",
            borderRadius: 16,
            padding: 18,
            boxShadow: "0 1px 3px rgba(44,74,67,0.1)",
            marginBottom: 16,
          }}
        >
          <label style={{ fontSize: 12, color: "#6B7570", display: "block", marginBottom: 6 }}>
            備註（選填）
          </label>
          <textarea
            value={note}
            onChange={(e) => setNote(e.target.value)}
            placeholder="例如：核心那堂課後兩天，腰側特別緊繃…"
            rows={3}
            style={{
              width: "100%",
              padding: "8px 10px",
              borderRadius: 8,
              border: "1px solid #E0DCCF",
              fontSize: 14,
              marginBottom: 14,
              boxSizing: "border-box",
              fontFamily: "inherit",
              resize: "vertical",
            }}
          />
          {error && <div style={{ color: "#B8412F", fontSize: 12, marginBottom: 10 }}>{error}</div>}
          <button
            onClick={saveEntry}
            style={{
              width: "100%",
              padding: "12px 0",
              borderRadius: 10,
              border: "none",
              background: "#2C4A43",
              color: "#F3EFE6",
              fontSize: 15,
              fontWeight: 700,
              cursor: "pointer",
            }}
          >
            儲存這次紀錄
          </button>
        </div>

        {/* 歷史紀錄：依上課日期分組（垂直、可收合），組內橫向滑動瀏覽每次記錄 */}
        <div style={{ background: "#FFFFFF", borderRadius: 16, boxShadow: "0 1px 3px rgba(44,74,67,0.08)" }}>
          <div style={{ padding: "14px 18px 4px", fontSize: 14, fontWeight: 700, color: "#2C4A43" }}>
            歷史紀錄（{records.length}）
          </div>
          <div style={{ padding: "0 0 8px" }}>
            {!loaded && <div style={{ fontSize: 13, color: "#9CA39C", padding: "8px 18px" }}>載入中…</div>}
            {loaded && groupedByClassDate.length === 0 && (
              <div style={{ fontSize: 13, color: "#9CA39C", padding: "8px 18px 16px" }}>
                還沒有紀錄，畫完記得按「儲存這次紀錄」
              </div>
            )}
            {groupedByClassDate.map(([cd, entries]) => {
              const isOpen = expandedGroups.has(cd);
              return (
                <div key={cd} style={{ borderTop: "1px solid #F0EDE3" }}>
                  <button
                    onClick={() => toggleGroup(cd)}
                    style={{
                      width: "100%",
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      padding: "12px 18px",
                      background: "none",
                      border: "none",
                      cursor: "pointer",
                      textAlign: "left",
                    }}
                  >
                    <span style={{ fontSize: 14, fontWeight: 700, color: "#2C4A43" }}>
                      {cd} 上課
                      <span style={{ fontWeight: 400, color: "#9CA39C", marginLeft: 8 }}>
                        {entries.length} 筆紀錄
                      </span>
                    </span>
                    <span style={{ color: "#9CA39C", fontSize: 12 }}>{isOpen ? "▲" : "▼"}</span>
                  </button>

                  {isOpen && (
                    <div
                      style={{
                        display: "flex",
                        gap: 12,
                        overflowX: "auto",
                        padding: "0 18px 16px",
                        WebkitOverflowScrolling: "touch",
                      }}
                    >
                      {entries.map((r) => (
                        <div
                          key={r.id}
                          style={{
                            flex: "0 0 auto",
                            width: 220,
                            border: "1px solid #F0EDE3",
                            borderRadius: 12,
                            padding: 10,
                          }}
                        >
                          <div
                            style={{
                              display: "flex",
                              justifyContent: "space-between",
                              alignItems: "center",
                              marginBottom: 6,
                            }}
                          >
                            <span style={{ fontSize: 12, fontWeight: 600, color: "#2E3532" }}>
                              {r.date}
                            </span>
                            <button
                              onClick={() => deleteRecord(r.id)}
                              style={{
                                border: "none",
                                background: "none",
                                color: "#C9A08F",
                                fontSize: 11,
                                cursor: "pointer",
                              }}
                            >
                              刪除
                            </button>
                          </div>
                          <div
                            onClick={() => openViewer(r.id)}
                            style={{ cursor: "pointer" }}
                          >
                            <CombinedBodyCanvas
                              strokes={legacyFlatten(r.strokes)}
                              interactive={false}
                              onStroke={() => {}}
                              height={130}
                            />
                          </div>
                          {r.note && (
                            <div style={{ fontSize: 11, color: "#6B7570", marginTop: 6 }}>{r.note}</div>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* 放大檢視器：點縮圖後開啟，可左右瀏覽所有紀錄 */}
      {viewerIndex !== null && flatEntries[viewerIndex] && (
        <ViewerModal
          entry={flatEntries[viewerIndex]}
          index={viewerIndex}
          total={flatEntries.length}
          onClose={closeViewer}
          onPrev={viewerPrev}
          onNext={viewerNext}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   放大檢視器：全螢幕顯示單筆紀錄的合併圖，可用箭頭按鈕或左右滑動
   瀏覽上一筆／下一筆（依畫面上顯示的完整順序）。
---------------------------------------------------------------- */
function ViewerModal({ entry, index, total, onClose, onPrev, onNext }) {
  const touchXRef = useRef(null);

  const handlePointerDown = (e) => {
    touchXRef.current = e.clientX;
  };
  const handlePointerUp = (e) => {
    if (touchXRef.current == null) return;
    const delta = e.clientX - touchXRef.current;
    if (delta > 50) onPrev();
    else if (delta < -50) onNext();
    touchXRef.current = null;
  };

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(20,18,16,0.94)",
        zIndex: 1000,
        display: "flex",
        flexDirection: "column",
      }}
    >
      <div
        style={{
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          padding: "16px 18px",
          flexShrink: 0,
        }}
      >
        <div style={{ color: "#F3EFE6", fontSize: 13 }}>
          {entry.classDate !== entry.date ? `上課 ${entry.classDate} → 記錄 ${entry.date}` : entry.date}
          <span style={{ color: "#9CA39C", marginLeft: 10 }}>
            {index + 1} / {total}
          </span>
        </div>
        <button
          onClick={onClose}
          style={{
            border: "none",
            background: "none",
            color: "#F3EFE6",
            fontSize: 22,
            cursor: "pointer",
            lineHeight: 1,
          }}
        >
          ✕
        </button>
      </div>

      <div
        style={{
          flex: 1,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          position: "relative",
          minHeight: 0,
          touchAction: "pan-y",
        }}
        onPointerDown={handlePointerDown}
        onPointerUp={handlePointerUp}
      >
        <button
          onClick={onPrev}
          disabled={index === 0}
          style={{
            position: "absolute",
            left: 6,
            zIndex: 1,
            border: "none",
            background: "none",
            color: index === 0 ? "rgba(243,239,230,0.25)" : "#F3EFE6",
            fontSize: 34,
            cursor: index === 0 ? "default" : "pointer",
            padding: "8px",
          }}
        >
          ‹
        </button>
        <CombinedBodyCanvas
          strokes={legacyFlatten(entry.strokes)}
          interactive={false}
          onStroke={() => {}}
          height="70vh"
        />
        <button
          onClick={onNext}
          disabled={index === total - 1}
          style={{
            position: "absolute",
            right: 6,
            zIndex: 1,
            border: "none",
            background: "none",
            color: index === total - 1 ? "rgba(243,239,230,0.25)" : "#F3EFE6",
            fontSize: 34,
            cursor: index === total - 1 ? "default" : "pointer",
            padding: "8px",
          }}
        >
          ›
        </button>
      </div>

      {entry.note && (
        <div style={{ color: "#D8D2C1", fontSize: 13, textAlign: "center", padding: "12px 24px 24px" }}>
          {entry.note}
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<BodyPainTracker />);
</script>
</body>
</html>
